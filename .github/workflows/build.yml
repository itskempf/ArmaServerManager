name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ArmaServerManager/ArmaServerManager.csproj
      
    - name: Build
      run: dotnet build ArmaServerManager/ArmaServerManager.csproj --configuration Release --no-restore
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ArmaServerManager-Build
        path: ArmaServerManager/bin/Release/
